[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "search-orchestrator"
version = "0.2.0"
description = "AI-powered bounded web research orchestrator with reranking and evidence evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=9.15.0",
    "httpcore>=1.0.9,<1.1.0",
    "httpx>=0.27.0,<1.0.0",
    "langchain>=1.4.6,<2.0.0",
    "langchain-core>=1.6.12,<2.0.0",
    "langchain-openai>=1.7.2,<2.0.0",
    "langgraph>=1.2.16,<2.0.0",
    "lxml>=5.0.0,<7.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyside6>=6.6.0,<7.0.0",
    "sentence-transformers>=3.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
search-orchestrator = "main:main"
search-orchestrator-gui = "gui.run:main"

[tool.setuptools]
py-modules = [
    "app_settings",
    "evaluation_helpers",
    "fallback_fetcher",
    "lmstudio_client",
    "main",
    "research_models",
    "search_orchestrator",
    "source_assessment",
    "source_scoring",
    "web_fetchers",
    "security",
]
packages = ["gui"]
