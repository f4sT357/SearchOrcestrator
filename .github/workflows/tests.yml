name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          echo "pytest_exit_code=$status" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
